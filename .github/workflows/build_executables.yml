name: Build Executables (Linux & Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux Executable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies (Tkinter)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk binutils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0.0"

      - name: Run unit tests
        run: python -m unittest discover tests -v

      - name: Build Linux binary with PyInstaller
        run: |
          pyinstaller --clean --noconfirm BrisasDelPalmar.spec
          chmod +x dist/BrisasDelPalmar

      - name: Upload Linux Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrisasDelPalmar-Linux-x86_64
          path: dist/BrisasDelPalmar
          if-no-files-found: error

  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0.0"

      - name: Run unit tests
        run: python -m unittest discover tests -v

      - name: Build Windows .exe with PyInstaller
        run: pyinstaller --clean --noconfirm BrisasDelPalmar.spec

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrisasDelPalmar-Windows-x64
          path: dist/BrisasDelPalmar.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries for release
        run: |
          mv artifacts/BrisasDelPalmar-Linux-x86_64/BrisasDelPalmar artifacts/BrisasDelPalmar-Linux-x86_64-bin
          chmod +x artifacts/BrisasDelPalmar-Linux-x86_64-bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/BrisasDelPalmar-Linux-x86_64-bin
            artifacts/BrisasDelPalmar-Windows-x64/BrisasDelPalmar.exe
          generate_release_notes: true

